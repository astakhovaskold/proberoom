services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-proberoom}
            POSTGRES_USER: ${POSTGRES_USER:-proberoom}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proberoom_password}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    backend:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 3000
            DATABASE_URL: postgresql://${POSTGRES_USER:-proberoom}:${POSTGRES_PASSWORD:-proberoom_password}@postgres:5432/${POSTGRES_DB:-proberoom}?schema=public
            FIRST_RUN_ADMIN_EMAIL: ${FIRST_RUN_ADMIN_EMAIL:-admin@example.com}
            FIRST_RUN_ADMIN_PASSWORD: ${FIRST_RUN_ADMIN_PASSWORD:-change-me-on-first-login}
            FIRST_RUN_ADMIN_NAME: ${FIRST_RUN_ADMIN_NAME:-Proberoom Admin}
        depends_on:
            postgres:
                condition: service_healthy
        expose:
            - "3000"

    nginx:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-/api}
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - "${HTTP_PORT:-80}:80"

volumes:
    postgres-data:
